<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="GameHub">
    </header>

    <main>

        <section>
            <h2>Minha biblioteca</h2>

            <form id="formPesquisa">
                <label for="campoPesquisa">Pesquisar jogos</label>
                <input type="text" id="campoPesquisa" name="pesquisa" placeholder="Digite o nome de um jogo">

                <button type="submit">Pesquisar</button>

                <button type="button" id="btnAdicionarJogo">
                    Adicionar novo jogo
                </button>
            </form>
        </section>

        <section>
            <h2>Jogos cadastrados</h2>

            <div id="gridJogos">

                <article class="card-jogo">
                    <img src="https://via.placeholder.com/300x400" alt="Capa do jogo">

                    <div class="info-jogo">
                        <h3>Nome do jogo</h3>
                        <p>★★★★★</p>
                    </div>
                </article>

                <article class="card-jogo">
                    <img src="https://via.placeholder.com/300x400" alt="Capa do jogo">

                    <div class="info-jogo">
                        <h3>Nome do jogo</h3>
                        <p>★★★★☆</p>
                    </div>
                </article>

                <article class="card-jogo">
                    <img src="https://via.placeholder.com/300x400" alt="Capa do jogo">

                    <div class="info-jogo">
                        <h3>Nome do jogo</h3>
                        <p>★★★★★</p>
                    </div>
                </article>

                <article class="card-jogo">
                    <img src="https://via.placeholder.com/300x400" alt="Capa do jogo">

                    <div class="info-jogo">
                        <h3>Nome do jogo</h3>
                        <p>★★★☆☆</p>
                    </div>
                </article>

                <article class="card-jogo">
                    <img src="https://via.placeholder.com/300x400" alt="Capa do jogo">

                    <div class="info-jogo">
                        <h3>Nome do jogo</h3>
                        <p>★★★★☆</p>
                    </div>
                </article>

                <article class="card-jogo">
                    <img src="https://via.placeholder.com/300x400" alt="Capa do jogo">

                    <div class="info-jogo">
                        <h3>Nome do jogo</h3>
                        <p>★★★★★</p>
                    </div>
                </article>

                <article class="card-jogo">
                    <img src="https://via.placeholder.com/300x400" alt="Capa do jogo">

                    <div class="info-jogo">
                        <h3>Nome do jogo</h3>
                        <p>★★★☆☆</p>
                    </div>
                </article>

                <article class="card-jogo">
                    <img src="https://via.placeholder.com/300x400" alt="Capa do jogo">

                    <div class="info-jogo">
                        <h3>Nome do jogo</h3>
                        <p>★★★★☆</p>
                    </div>
                </article>

                <article class="card-jogo">
                    <img src="https://via.placeholder.com/300x400" alt="Capa do jogo">

                    <div class="info-jogo">
                        <h3>Nome do jogo</h3>
                        <p>★★★★★</p>
                    </div>
                </article>

            </div>
        </section>

        <nav class="paginacao" id="paginacao"></nav>

    </main>

    <!-- Modal de cadastro de jogo -->
    <div id="modalCadastro" class="modal oculta">

        <div class="modal-conteudo">

            <div class="modal-cabecalho">
                <h2>Cadastrar novo jogo</h2>

                <button type="button" id="btnFecharModal" aria-label="Fechar modal">
                    &times;
                </button>
            </div>

            <form id="formCadastroJogo">

                <div class="campo-formulario">
                    <label for="nomeJogo">Nome do jogo</label>
                    <input type="text" id="nomeJogo" name="nome" placeholder="Digite o nome do jogo" required>
                    <button type="button" id="btnBuscarJogo"> Buscar jogo </button>
                    <div id="resultadosBusca"></div>
                    <div id="jogoSelecionado" class="jogo-selecionado oculta">
                        <img id="capaJogoSelecionado" alt="Capa do jogo selecionado">
                    </div>
                </div>

                <div class="campo-formulario">
                    <label for="generoJogo">Gênero</label>
                    <input type="text" id="generoJogo" name="genero" placeholder="Ex.: RPG, Ação, Aventura" required>
                </div>

                <div class="campo-formulario">
                    <label for="anoJogo">Ano de lançamento</label>
                    <input type="number" id="anoJogo" name="ano" placeholder="Ex.: 2025" required>
                </div>

                <div class="campo-formulario">
                    <label for="publisherJogo">Publisher</label>
                    <input type="text" id="publisherJogo" name="publisher" placeholder="Digite a publisher" required>
                </div>

                <div class="campo-formulario">
                    <label for="desenvolvedoraJogo">Desenvolvedora</label>
                    <input type="text" id="desenvolvedoraJogo" name="desenvolvedora"
                        placeholder="Digite a desenvolvedora" required>
                </div>

                <div class="campo-formulario">
                    <label for="notaJogo">Sua avaliação</label>

                    <select id="notaJogo" name="nota" required>
                        <option value="">Selecione uma nota</option>
                        <option value="1">★☆☆☆☆</option>
                        <option value="2">★★☆☆☆</option>
                        <option value="3">★★★☆☆</option>
                        <option value="4">★★★★☆</option>
                        <option value="5">★★★★★</option>
                    </select>
                </div>

                <div class="modal-acoes">

                    <button type="button" id="btnCancelar">
                        Cancelar
                    </button>

                    <button type="submit">
                        Salvar jogo
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
