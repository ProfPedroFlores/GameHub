# Nome do projeto Docker Compose.
# Garante que a execução manual e a execução pelo Jenkins
# administrem o mesmo ambiente, mesmo estando em pastas diferentes.
name: gamehub

services:
  # Utiliza a imagem oficial do MySQL
  # Verificar a tag "latest"
  mysql:
    image: mysql:8.4
    
    # Carrega as variáveis de ambiente para configurar o MySQL
    env_file:
      - ./backend/.env.docker

    # Lê o HealthCheck para verificar se o serviço iniciou corretamente
    healthcheck:
      test: 
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"
        ]
      # Executa a verificação a cada 5 segundos
      interval: 5s

      # Cada tentativa pode levar no máximo 5 segundos
      timeout: 5s

      #Tenta por N vezes executar o serviço
      retries: 10

      # Dá ao MySQL um tempo para terminar sua inicialização
      start_period: 20s
    
    # Inicialização do banco  
    volumes:
      #Disponibiliza o script SQL dentro do diretório
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # :ro significa "read only"
      - gamehub-data:/var/lib/mysql
    
  gamehub:
  # Não existe uma imagem pronta
    build:
      context: .

      dockerfile: Dockerfile

    ports:
      - "3000:3000"
      
    env_file:
      - ./backend/.env.docker

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  gamehub-data: